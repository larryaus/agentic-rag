<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智答 · Agentic RAG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="h-screen bg-slate-50 text-slate-900">
  <div class="flex h-full">
    <!-- 左栏：文档面板 -->
    <aside class="w-[28%] min-w-[280px] border-r border-slate-200 bg-white flex flex-col">
      <header class="p-4 border-b border-slate-200">
        <h1 class="text-lg font-semibold">📚 知识库</h1>
        <p class="text-xs text-slate-500 mt-1">上传文档后即可在右侧聊天中检索</p>
      </header>
      <div class="p-4 border-b border-slate-200">
        <label class="block">
          <span class="sr-only">上传文档</span>
          <input id="file-input" type="file" multiple
                 accept=".md,.markdown,.txt,.html,.htm,.pdf"
                 class="block w-full text-sm text-slate-700
                        file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0
                        file:text-sm file:font-semibold
                        file:bg-indigo-50 file:text-indigo-700
                        hover:file:bg-indigo-100" />
        </label>
        <div id="upload-status" class="text-xs text-slate-500 mt-2 min-h-[1em]"></div>
      </div>
      <div class="flex-1 overflow-y-auto" id="doc-list">
        <div class="p-4 text-sm text-slate-400">加载中…</div>
      </div>
      <footer class="p-3 border-t border-slate-200 text-xs text-slate-500">
        勾选文档可将检索范围限定到所选文档
      </footer>
    </aside>

    <!-- 右栏：聊天 -->
    <main class="flex-1 flex flex-col">
      <header class="p-4 border-b border-slate-200 bg-white flex items-center justify-between">
        <div>
          <h2 class="text-lg font-semibold">💬 智答</h2>
          <p class="text-xs text-slate-500" id="session-info">尚未开始会话</p>
        </div>
        <button id="new-session"
                class="px-3 py-1.5 text-sm rounded-md bg-slate-100 hover:bg-slate-200">
          新会话
        </button>
      </header>

      <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50"></div>

      <form id="chat-form" class="p-4 border-t border-slate-200 bg-white">
        <div class="flex gap-2">
          <textarea id="chat-input" rows="2"
                    placeholder="向知识库提问，按 Enter 发送，Shift+Enter 换行"
                    class="flex-1 px-3 py-2 border border-slate-300 rounded-md
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           resize-none"></textarea>
          <button id="send-btn" type="submit"
                  class="px-5 py-2 bg-indigo-600 text-white rounded-md
                         hover:bg-indigo-700 disabled:bg-slate-300">
            发送
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
