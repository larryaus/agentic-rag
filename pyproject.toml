[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-service"
version = "0.1.0"
description = "Agentic AI knowledge assistant with RAG (Claude + pgvector + Voyage)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sse-starlette~=2.1",
    "anthropic>=0.40",
    "voyageai~=0.3",
    "asyncpg~=0.30",
    "pgvector~=0.3",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "pypdf~=5.1",
    "markdown-it-py~=3.0",
    "beautifulsoup4~=4.12",
    "tiktoken~=0.8",
    "httpx~=0.27",
    "python-multipart~=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "respx~=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
